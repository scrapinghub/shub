[tox]
requires =
    sphinx-scrapy @ git+https://github.com/scrapy/sphinx-scrapy.git@0.8.4
envlist = flake8,min,min-poetry,py,poetry,docs

[testenv]
basepython = python3
setenv =
    USING_TOX=1
deps =
    -r tests/requirements.txt
commands =
    pytest --cov=shub --cov-report=term-missing --cov-report=html --cov-report=xml {posargs:shub tests}

[testenv:min]
basepython = python3.10
deps =
    {[testenv]deps}
    pipenv<2024.3.0
    python-dotenv==1.0.0

[testenv:min-poetry]
basepython = python3.10
deps =
    {[testenv]deps}
    poetry-core<2

[testenv:poetry]
deps =
    {[testenv:min]deps}
    poetry-core
    poetry-plugin-export

[testenv:flake8]
deps =
    flake8>=3.7.9
commands =
    flake8 --exclude=.git,.tox,venv* {posargs:shub tests}
